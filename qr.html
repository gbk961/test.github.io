<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二维码生成</title>
    <link rel="stylesheet" type="text/css" href="https://lf3-cdn-tos.bytecdntp.com/cdn/expire-1-M/layui/2.7.6/css/layui.css" />
    <style>
        #qrcode canvas, #qrcode img {
            max-width: 100%;
            height: auto !important;
            border: 1px solid #f0f0f0;
            padding: 5px;
        }
        .layui-container { max-width: 900px; }
    </style>
</head>
<body>

<div class="layui-container" style="margin-top: 30px;">
    <fieldset class="layui-elem-field layui-field-title">
        <legend>二维码生成器</legend>
    </fieldset>
    
    <div class="layui-row layui-col-space30">
        <div class="layui-col-xs12 layui-col-md6">
            <form class="layui-form">
                <div class="layui-form-item layui-form-text">
                    <textarea placeholder="在此输入内容，右侧自动更新..." class="layui-textarea" id="txtInput" style="height: 256px"></textarea>
                </div>
            </form>
        </div>
        <div class="layui-col-xs12 layui-col-md6" style="text-align: center;">
            <div id="qrcode" style="display: inline-block; width: 256px; height: 256px; background: #fafafa; line-height: 256px; color: #ccc;">
                等待输入...
            </div>
            <p style="margin-top: 15px; color: #666; font-weight: bold;">实时预览</p>
        </div>
    </div>
</div>

<script src="https://lf26-cdn-tos.bytecdntp.com/cdn/expire-1-M/jquery/3.6.0/jquery.min.js"></script>
<script src="https://lf6-cdn-tos.bytecdntp.com/cdn/expire-1-M/layui/2.7.6/layui.js"></script>
<script src="https://lf3-cdn-tos.bytecdntp.com/cdn/expire-1-M/jquery.qrcode/1.0/jquery.qrcode.min.js"></script>

<script>
layui.use(['layer'], function(){
    var $ = layui.jquery;
    var lastContent = "";

    // 处理中文编码
    function toUtf8(str) {
        var out = "";
        for(var i = 0; i < str.length; i++) {
            var c = str.charCodeAt(i);
            if ((c >= 0x0001) && (c <= 0x007F)) {
                out += str.charAt(i);
            } else if (c > 0x07FF) {
                out += String.fromCharCode(0xE0 | ((c >> 12) & 0x0F));
                out += String.fromCharCode(0x80 | ((c >> 6) & 0x3F));
                out += String.fromCharCode(0x80 | ((c >> 0) & 0x3F));
            } else {
                out += String.fromCharCode(0xC0 | ((c >> 6) & 0x1F));
                out += String.fromCharCode(0x80 | ((c >> 0) & 0x3F));
            }
        }
        return out;
    }

    function renderQR() {
        var val = $('#txtInput').val();
        if (val === lastContent) return;
        lastContent = val;

        $("#qrcode").empty().css("line-height", "normal");
        
        if (val.trim() !== "") {
            $('#qrcode').qrcode({
                render: "canvas",
                text: toUtf8(val),
                width: 256,
                height: 256,
                background: "#ffffff",
                foreground: "#000000"
            });
        } else {
            $("#qrcode").text("等待输入...").css("line-height", "256px");
        }
    }

    // 绑定输入事件
    $('#txtInput').on('input propertychange', renderQR);

    // 初始加载：显示当前页面地址
    $('#txtInput').val(window.location.href);
    renderQR();
});
</script>
</body>
</html>
