<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二维码生成 - USTC Mirror</title>
    <link rel="stylesheet" href="https://mirrors.ustc.edu.cn/layui/dist/css/layui.css" />
    <style>
        body { background-color: #f5f7f9; padding: 20px; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
        .container-box { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); margin: 0 auto; max-width: 1000px; }
        #qrcode { 
            background: #fff; 
            padding: 15px; 
            border: 1px solid #eee; 
            display: inline-block;
            width: 256px;
            height: 256px;
            box-sizing: content-box;
        }
        #qrcode canvas { width: 100% !important; height: auto !important; }
        .layui-textarea { border-radius: 6px; resize: none; font-size: 14px; line-height: 1.6; }
        .tip-text { color: #999; font-size: 12px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container-box">
    <fieldset class="layui-elem-field layui-field-title">
        <legend>二维码生成器</legend>
    </fieldset>

    <div class="layui-row layui-col-space30">
        <div class="layui-col-md7">
            <form class="layui-form">
                <div class="layui-form-item">
                    <textarea id="txtInput" placeholder="输入网址或文字内容..." class="layui-textarea" style="height: 260px"></textarea>
                </div>
            </form>
            <p class="tip-text">● 本地实时生成 ● 保护隐私不上传 ● 适配 HTTPS 安全环境</p>
        </div>

        <div class="layui-col-md5" style="text-align: center;">
            <div id="qrcode"></div>
            <div style="margin-top: 15px;">
                <span class="layui-badge layui-bg-blue">实时预览</span>
            </div>
        </div>
    </div>
</div>

<script src="https://mirrors.ustc.edu.cn/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
<script src="https://mirrors.ustc.edu.cn/layui/dist/layui.js"></script>
<script src="https://mirrors.ustc.edu.cn/ajax/libs/jquery.qrcode/1.0/jquery.qrcode.min.js"></script>

<script>
layui.use(['layer'], function(){
    var $ = layui.jquery;
    var lastVal = "";

    // 解决中文二维码乱码
    function toUtf8(str) {
        var out = "";
        for(var i = 0; i < str.length; i++) {
            var c = str.charCodeAt(i);
            if ((c >= 0x0001) && (c <= 0x007F)) {
                out += str.charAt(i);
            } else if (c > 0x07FF) {
                out += String.fromCharCode(0xE0 | ((c >> 12) & 0x0F));
                out += String.fromCharCode(0x80 | ((c >> 6) & 0x3F));
                out += String.fromCharCode(0x80 | ((c >> 0) & 0x3F));
            } else {
                out += String.fromCharCode(0xC0 | ((c >> 6) & 0x1F));
                out += String.fromCharCode(0x80 | ((c >> 0) & 0x3F));
            }
        }
        return out;
    }

    function updateQR() {
        var val = $('#txtInput').val();
        if (val === lastVal) return;
        lastVal = val;

        $("#qrcode").empty();
        if (val.trim() !== "") {
            $('#qrcode').qrcode({
                render: "canvas",
                text: toUtf8(val),
                width: 256,
                height: 256
            });
        }
    }

    // 监听输入事件
    $('#txtInput').on('input propertychange', updateQR);

    // 初始显示当前链接
    $('#txtInput').val(window.location.href);
    updateQR();
});
</script>
</body>
</html>
