<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二维码生成器</title>
    <link rel="stylesheet" type="text/css" href="https://www.layuicdn.com/layui/css/layui.css" />
    <style>
        #qrcode canvas { width: 100%; height: auto; border: 1px solid #eee; padding: 10px; }
    </style>
</head>
<body>

<div class="layui-container" style="margin-top: 30px;">
    <fieldset class="layui-elem-field layui-field-title">
        <legend>二维码生成 (GitHub Pages 版)</legend>
    </fieldset>
    
    <div class="layui-row layui-col-space30">
        <div class="layui-col-md6">
            <form class="layui-form">
                <div class="layui-form-item layui-form-text">
                    <textarea id="txtInput" placeholder="请输入内容，右侧将自动实时生成二维码" class="layui-textarea" style="height: 200px"></textarea>
                </div>
                <div class="layui-word-aux" style="margin-bottom: 10px;">注：静态环境下文件上传功能已禁用。</div>
            </form>
        </div>
        <div class="layui-col-md6" style="text-align: center;">
            <div id="qrcode"></div>
            <p style="margin-top: 10px; color: #999;">生成的二维码</p>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
<script src="https://www.layuicdn.com/layui/layui.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.qrcode/1.0/jquery.qrcode.min.js"></script>

<script>
layui.use(['layer', 'form'], function(){
    var $ = layui.jquery;
    var lastContent = "";

    // 字符转码函数
    function toUtf8(str) {
        var out, i, len, c;
        out = "";
        len = str.length;
        for(i = 0; i < len; i++) {
            c = str.charCodeAt(i);
            if ((c >= 0x0001) && (c <= 0x007F)) {
                out += str.charAt(i);
            } else if (c > 0x07FF) {
                out += String.fromCharCode(0xE0 | ((c >> 12) & 0x0F));
                out += String.fromCharCode(0x80 | ((c >> 6) & 0x3F));
                out += String.fromCharCode(0x80 | ((c >> 0) & 0x3F));
            } else {
                out += String.fromCharCode(0xC0 | ((c >> 6) & 0x1F));
                out += String.fromCharCode(0x80 | ((c >> 0) & 0x3F));
            }
        }
        return out;
    }

    function generateQR() {
        var content = $('#txtInput').val();
        if (content === lastContent) return;
        lastContent = content;
        
        $("#qrcode").empty();
        if (content.trim() !== "") {
            $('#qrcode').qrcode({
                render: "canvas",
                text: toUtf8(content),
                width: 256,
                height: 256
            });
        }
    }

    // 监听输入，实时生成
    $('#txtInput').on('input propertychange', function() {
        generateQR();
    });

    // 初始化显示当前 URL
    $('#txtInput').val(window.location.href);
    generateQR();
});
</script>
</body>
</html>
