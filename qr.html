<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二维码生成</title>
    <link rel="stylesheet" type="text/css" href="https://www.layuicdn.com/layui-2.7.6/css/layui.css" />
    <style>
        /* 强制二维码图片撑满li容器，保持之前的样式 */
        #qrcode canvas, #qrcode img {
            width: 100% !important;
            height: auto !important;
        }
    </style>
</head>
<body>

<div class="layui-container" style="margin-top: 30px;">
    <fieldset class="layui-elem-field layui-field-title">
        <legend>二维码生成器</legend>
    </fieldset>
    
    <div class="layui-row layui-col-space30">
        <div class="layui-col-xs12 layui-col-md6">
            <form class="layui-form">
                <div class="layui-form-item layui-form-text">
                    <div class="layui-input-block" style="margin-left: 0;">
                        <textarea placeholder="请输入内容..." class="layui-textarea" name="txt" id="txt" style="height: 256px"></textarea>
                    </div>
                </div>
            </form>
        </div>
        <div class="layui-col-xs12 layui-col-md6" style="text-align: center;">
            <div id="qrcode" style="display: inline-block; width: 256px; height: 256px;"></div>
            <p style="margin-top: 10px; color: #999;">生成的二维码</p>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
<script src="https://www.layuicdn.com/layui-2.7.6/layui.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.qrcode/1.0/jquery.qrcode.min.js"></script>

<script>
layui.use(['layer', 'form'], function(){
    var form = layui.form;
    var $ = layui.jquery;
    var lastContent = "";

    // 字符转码函数
    function toUtf8(str) {
        var out, i, len, c;
        out = "";
        len = str.length;
        for(i = 0; i < len; i++) {
            c = str.charCodeAt(i);
            if ((c >= 0x0001) && (c <= 0x007F)) {
                out += str.charAt(i);
            } else if (c > 0x07FF) {
                out += String.fromCharCode(0xE0 | ((c >> 12) & 0x0F));
                out += String.fromCharCode(0x80 | ((c >> 6) & 0x3F));
                out += String.fromCharCode(0x80 | ((c >> 0) & 0x3F));
            } else {
                out += String.fromCharCode(0xC0 | ((c >> 6) & 0x1F));
                out += String.fromCharCode(0x80 | ((c >> 0) & 0x3F));
            }
        }
        return out;
    }

    function generateQR() {
        var content = $('#txt').val();
        if (content === lastContent) return; // 避免重复生成
        lastContent = content;
        
        $("#qrcode").empty(); // 清空旧二维码
        
        if (content.trim() !== "") {
            // 使用标准参数生成
            jQuery('#qrcode').qrcode({
                render: "canvas", // 性能更好
                text: toUtf8(content),
                width: 256,
                height: 256
            });
        }
    }

    // 监听文本框输入，实时生成（兼容 propertychange）
    $('#txt').on('input propertychange', function() {
        generateQR();
    });

    // 移除之前的定时器 $('#btn').click() 逻辑，改用直接监听
});
</script>
</body>
</html>
